services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingest_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ingestion}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ingest} -d ${POSTGRES_DB:-ingestion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-ingestion-raw};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ingestion-raw}

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q \"200\"'"]
      interval: 5s
      timeout: 5s
      retries: 15

  qdrant-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.qdrant.setup
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hybrid_ingestion}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ingest}:${POSTGRES_PASSWORD:-ingest_secret}@postgres:5432/${POSTGRES_DB:-ingestion}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-ingest}:${POSTGRES_PASSWORD:-ingest_secret}@postgres:5432/${POSTGRES_DB:-ingestion}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hybrid_ingestion}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ingestion-raw}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_ALGORITHM: HS256
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      REDUCTO_API_KEY: ${REDUCTO_API_KEY:-}
      PDF_PARSER: ${PDF_PARSER:-unstructured}
      UNSTRUCTURED_STRATEGY: ${UNSTRUCTURED_STRATEGY:-fast}
      UNSTRUCTURED_INFER_TABLES: ${UNSTRUCTURED_INFER_TABLES:-false}

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app.celery worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ingest}:${POSTGRES_PASSWORD:-ingest_secret}@postgres:5432/${POSTGRES_DB:-ingestion}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-ingest}:${POSTGRES_PASSWORD:-ingest_secret}@postgres:5432/${POSTGRES_DB:-ingestion}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-hybrid_ingestion}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ingestion-raw}
      LLAMAPARSE_API_KEY: ${LLAMAPARSE_API_KEY:-}
      REDUCTO_API_KEY: ${REDUCTO_API_KEY:-}
      EMBEDDER_RATE_LIMIT_JITTER: ${EMBEDDER_RATE_LIMIT_JITTER:-1.0}
      PDF_PARSER: ${PDF_PARSER:-unstructured}
      UNSTRUCTURED_STRATEGY: ${UNSTRUCTURED_STRATEGY:-fast}
      UNSTRUCTURED_INFER_TABLES: ${UNSTRUCTURED_INFER_TABLES:-false}

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
